<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing HTTP Methods</title>
</head>

<body>
    <h1>My Page - Testing HTTP Methods</h1>
    
    <!-- 
        This page demonstrates client-side HTTP requests using Fetch API
        Served as static file from 'public' folder
        Access: http://localhost:3000/mypage.html
    -->
    
    <script>
        // ============================================
        // FETCH API - Making HTTP Requests from Browser
        // ============================================
        
        async function testPost() {
            try {
                // TEST 1: POST REQUEST
                // Sends POST request to '/' endpoint
                // Server route: app.post('/', ...) in main.js
                let a = await fetch('/', { method: 'POST' });
                let b = await a.text(); // Convert response to text
                console.log('====================================');
                console.log('POST Response:', b);
                console.log('====================================');

                // TEST 2: DELETE REQUEST
                // Sends DELETE request to '/del' endpoint
                // Server route: app.delete('/del', ...) in main.js
                let c = await fetch('/del', { method: 'DELETE' });
                let d = await c.text();
                console.log('====================================');
                console.log('DELETE Response:', d);
                console.log('====================================');

                // TEST 3: PUT REQUEST
                // Sends PUT request to '/myput' endpoint
                // Server route: app.put('/myput', ...) in main.js
                let e = await fetch('/myput', { method: 'PUT' });
                let f = await e.text();
                console.log('====================================');
                console.log('PUT Response:', f);
                console.log('====================================');
                
            } catch (error) {
                // Error handling for network failures
                console.log('====================================');
                console.log('Error:', error);
                console.log('====================================');
            }
        }
        
        // Auto-execute function when page loads
        testPost()
    </script>
</body>

</html>
